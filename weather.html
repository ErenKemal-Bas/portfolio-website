<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather App</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    background:linear-gradient(to bottom,#dbeafe,#f8fafc);
}

.weather-card{
    width:350px;
    padding:35px;
    border-radius:30px;
    background:rgba(255,255,255,0.6);
    backdrop-filter:blur(20px);
    box-shadow:0 10px 40px rgba(0,0,0,0.1);
    text-align:center;
}

.weather-card h1{
    font-size:32px;
    margin-bottom:10px;
    color:#111827;
}

.weather-card p{
    color:#4b5563;
    margin-bottom:30px;
}

.temp{
    font-size:70px;
    font-weight:bold;
    color:#111827;
}

.status{
    font-size:22px;
    margin-top:10px;
    color:#2563eb;
}

.city{
    margin-top:20px;
    font-size:18px;
    color:#6b7280;
}

.back-btn{
    position:absolute;
    top:30px;
    left:30px;
    text-decoration:none;
    background:white;
    color:#111827;
    padding:12px 20px;
    border-radius:30px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

</style>

</head>
<body>

<a href="./index.html" class="back-btn">
    ← Back
</a>

<div class="weather-card">

    <h1>Weather App</h1>

    <p>Minimal Apple inspired weather interface.</p>

    <div class="temp">24°</div>

    <div class="status">Sunny ☀️</div>

    <div class="city">Prague, Czech Republic</div>

</div>

</body>
</html>
